[project]
name = "realtime-auction-platform"
version = "0.1.0"
description = "WebSocket auction engine: optimistic locking, Redis pub/sub fan-out, three auction workflows"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "sqlalchemy>=2.0",
  "redis>=5",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
dev = ["pytest>=8", "httpx>=0.27", "websockets>=12", "fakeredis>=2.23", "ruff>=0.5"]

[tool.setuptools]
packages = ["app"]
package-data = { app = ["static/*"] }

[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
