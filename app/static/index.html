<!doctype html>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Realtime Auction</title>
<style>
body{font:15px system-ui;max-width:640px;margin:2rem auto;padding:0 1rem}
input,select,button{font:inherit;padding:.4rem;margin:.2rem 0}
#state{background:#f4f4f6;padding:1rem;border-radius:8px;white-space:pre-wrap;font-family:monospace}
#log{color:#555;font-size:13px}
</style>
<h2>Realtime Auction</h2>
<div>
  <select id="kind"><option>english</option><option>dutch</option><option>sealed</option></select>
  <input id="title" value="Demo lot" size="14"> start <input id="start" type="number" value="100" style="width:5em">
  <button onclick="create()">Create auction</button>
</div>
<div>Auction id <input id="aid" type="number" value="1" style="width:4em">
  <button onclick="join()">Join</button></div>
<div>Name <input id="who" value="alice" size="8"> amount <input id="amt" type="number" value="110" style="width:6em">
  <button onclick="bid()">Bid</button></div>
<p id="state">not connected</p><div id="log"></div>
<script>
let ws, seen = -1, n = 0;
const $ = id => document.getElementById(id), log = t => $('log').prepend(t + '\n');
async function create() {
  const kind = $('kind').value, start_price = +$('start').value;
  const body = {kind, title: $('title').value, start_price, duration: 600,
    ...(kind === 'dutch' ? {floor_price: Math.floor(start_price / 2), decrement: 1, interval_seconds: 1} : {}),
    ...(kind === 'english' ? {snipe_window: 10, extension: 15} : {})};
  const r = await (await fetch('/auctions', {method: 'POST', headers: {'content-type': 'application/json'}, body: JSON.stringify(body)})).json();
  $('aid').value = r.id; join();
}
function join() {
  if (ws) ws.close(); seen = -1;
  ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/ws/auctions/' + $('aid').value);
  ws.onmessage = e => {
    const m = JSON.parse(e.data);
    if (m.type === 'state' && m.version > seen) { seen = m.version; $('state').textContent = JSON.stringify(m, null, 1); }
    else if (m.type !== 'state') log(JSON.stringify(m));
  };
  ws.onclose = () => log('socket closed');
}
function bid() { ws.send(JSON.stringify({type: 'bid', bidder: $('who').value, amount: +$('amt').value, key: crypto.randomUUID()})); }
</script>
